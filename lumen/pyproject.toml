# LƯU Ý: file này chỉ để KHAI BÁO/tài liệu hoá phụ thuộc.
# Dự án KHÔNG cài bằng pip/uv/venv — deps lấy từ pacman ở hệ thống.
# Xem README.md ở gốc repo.

[project]
name = "lumen"
version = "0.1.0"
description = "Minimal glass music player for Hyprland + Noctalia"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.9",
    "python-mpv>=1.0",
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47",
]

[project.scripts]
lumen = "lumen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
